[project]
name = "stock-api"
version = "0.0.1"
description = "Stock Visualizer Python FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "starlette==0.41.3",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0,<0.29",
  "python-dotenv>=1.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
